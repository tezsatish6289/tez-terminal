# Optimized for Singapore (asia-southeast1) Deployment
runConfig:
  maxInstances: 3
  minInstances: 1
  memoryMiB: 1024
  timeoutSeconds: 120

env:
  - variable: NODE_ENV
    value: production
  - variable: NEXT_PUBLIC_REGION
    value: asia-southeast1
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: G-9SSXWJTR1L
  # Microsoft Clarity — FNONINJA session replay / heatmaps (client bundle).
  - variable: NEXT_PUBLIC_CLARITY_PROJECT_ID
    value: xwyycvqx0o

  # Realtime Database — community chat live stream + presence (Singapore).
  # NEXT_PUBLIC_ must be available at build time so it inlines into the client bundle.
  - variable: NEXT_PUBLIC_FIREBASE_DATABASE_URL
    value: https://studio-6235588950-a15f2-default-rtdb.asia-southeast1.firebasedatabase.app
  - variable: FIREBASE_DATABASE_URL
    value: https://studio-6235588950-a15f2-default-rtdb.asia-southeast1.firebasedatabase.app
    availability:
      - RUNTIME
  - variable: TELEGRAM_BOT_TOKEN
    secret: TELEGRAM_BOT_TOKEN
    availability:
      - RUNTIME
  - variable: CRON_SECRET
    secret: CRON_SECRET
    availability:
      - RUNTIME
  - variable: NOWPAYMENTS_API_KEY
    secret: NOWPAYMENTS_API_KEY
    availability:
      - RUNTIME
  - variable: NOWPAYMENTS_IPN_SECRET
    secret: NOWPAYMENTS_IPN_SECRET
    availability:
      - RUNTIME
  - variable: TWITTER_CLIENT_ID
    secret: TWITTER_CLIENT_ID
    availability:
      - RUNTIME
  - variable: TWITTER_CLIENT_SECRET
    secret: TWITTER_CLIENT_SECRET
    availability:
      - RUNTIME
  - variable: GOOGLE_GENAI_API_KEY
    secret: GOOGLE_GENAI_API_KEY
    availability:
      - RUNTIME
  - variable: ENCRYPTION_KEY
    secret: ENCRYPTION_KEY
    availability:
      - RUNTIME
  - variable: DHAN_ACCESS_TOKEN
    secret: DHAN_ACCESS_TOKEN
    availability:
      - RUNTIME
  - variable: DHAN_CLIENT_ID
    secret: DHAN_CLIENT_ID
    availability:
      - RUNTIME
  - variable: DHAN_TOTP_SECRET
    secret: DHAN_TOTP_SECRET
    availability:
      - RUNTIME
  - variable: DHAN_PIN
    secret: DHAN_PIN
    availability:
      - RUNTIME
  - variable: SOLANA_RPC_URL
    secret: SOLANA_RPC_URL
    availability:
      - RUNTIME
  - variable: SOLANA_PRIVATE_KEY
    secret: SOLANA_PRIVATE_KEY
    availability:
      - RUNTIME
  - variable: LIQUIDITY_WS_SECRET
    secret: LIQUIDITY_WS_SECRET
    availability:
      - RUNTIME
  - variable: PUBLIC_LIVE_PASSPHRASE
    secret: PUBLIC_LIVE_PASSPHRASE
    availability:
      - RUNTIME
  # India ISP egress proxy for ALL NSE traffic (nseFetch honours NSE_HTTPS_PROXY).
  # Presents an Indian residential IP so NSE stops blocking us into the Dhan fallback.
  # NOTE: create the secret BEFORE deploying, else the rollout fails:
  #   firebase apphosting:secrets:set NSE_HTTPS_PROXY
  - variable: NSE_HTTPS_PROXY
    secret: NSE_HTTPS_PROXY
    availability:
      - RUNTIME
  # suggest-stock-zones: background batch after cron GET returns (cron-job.org 30s HTTP cap).
  # 3 symbols × ~25s Dhan fits reliably in 95s wall clock (10 was timing out at 2–3).
  - variable: STOCK_ZONES_BATCH_SIZE
    value: "3"
    availability:
      - RUNTIME
  - variable: STOCK_ZONES_MAX_RUN_MS
    value: "95000"
  - variable: STOCK_ZONES_SYMBOL_TIMEOUT_MS
    value: "28000"
    availability:
      - RUNTIME
  # Buffer publishing — personal API key from publish.buffer.com/settings/api.
  # Powers /admin/videos → "Schedule to Buffer" (multi-channel video posting).
  #   firebase apphosting:secrets:set BUFFER_API_KEY
  - variable: BUFFER_API_KEY
    secret: BUFFER_API_KEY
    availability:
      - RUNTIME
  # Cloud Run Job that renders the put/call videos (see scripts/deploy-video-renderer.sh).
  # Presence of VIDEO_RENDER_JOB switches /admin/videos render from "local only"
  # to triggering the cloud job + polling video_renders/{id}.
  - variable: VIDEO_RENDER_JOB
    value: fnoninja-video-renderer
    availability:
      - RUNTIME
  - variable: VIDEO_RENDER_REGION
    value: us-central1
    availability:
      - RUNTIME
  - variable: GOOGLE_OAUTH_CLIENT_ID
    secret: GOOGLE_OAUTH_CLIENT_ID
  - variable: GOOGLE_OAUTH_CLIENT_SECRET
    secret: GOOGLE_OAUTH_CLIENT_SECRET
  - variable: GOOGLE_OAUTH_REFRESH_TOKEN
    secret: GOOGLE_OAUTH_REFRESH_TOKEN
  # ── Zoho Billing (FNONINJA subscriptions) ───────────────────────────────────
  # Non-secret identifiers (safe to keep inline).
  - variable: ZOHO_BILLING_DC
    value: in
    availability:
      - RUNTIME
  - variable: ZOHO_BILLING_ORG_ID
    value: "60063719033"
    availability:
      - RUNTIME
  - variable: ZOHO_BILLING_DAYPASS_ITEM_ID
    value: "3461880000000045068"
    availability:
      - RUNTIME
  # Credentials + signing secret — create in Secret Manager BEFORE deploying:
  #   firebase apphosting:secrets:set ZOHO_BILLING_CLIENT_ID
  #   firebase apphosting:secrets:set ZOHO_BILLING_CLIENT_SECRET
  #   firebase apphosting:secrets:set ZOHO_BILLING_REFRESH_TOKEN
  #   firebase apphosting:secrets:set ZOHO_BILLING_WEBHOOK_SECRET
  - variable: ZOHO_BILLING_CLIENT_ID
    secret: ZOHO_BILLING_CLIENT_ID
    availability:
      - RUNTIME
  - variable: ZOHO_BILLING_CLIENT_SECRET
    secret: ZOHO_BILLING_CLIENT_SECRET
    availability:
      - RUNTIME
  - variable: ZOHO_BILLING_REFRESH_TOKEN
    secret: ZOHO_BILLING_REFRESH_TOKEN
    availability:
      - RUNTIME
  - variable: ZOHO_BILLING_WEBHOOK_SECRET
    secret: ZOHO_BILLING_WEBHOOK_SECRET
    availability:
      - RUNTIME
  # Resend marketing Broadcasts — SR-audit win stories emailed to FNO Ninja users
  # after a successful Buffer schedule. Create secrets before deploy:
  #   firebase apphosting:secrets:set RESEND_API_KEY
  # Non-secret identifiers can stay inline once the domain/segment are fixed.
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
    availability:
      - RUNTIME
  - variable: RESEND_SEGMENT_ID
    value: "53d6b06d-e534-404f-bc02-bf7d243f96da"
    availability:
      - RUNTIME
  - variable: RESEND_FROM
    value: "FNO Ninja <hello@updates.fnoninja.com>"
    availability:
      - RUNTIME
  - variable: RESEND_SR_AUDIT_EMAIL
    value: "true"
    availability:
      - RUNTIME
