# Optimized for Singapore (asia-southeast1) Deployment
runConfig:
  maxInstances: 3
  minInstances: 1
  memoryMiB: 1024
  timeoutSeconds: 120

env:
  - variable: NODE_ENV
    value: production
  - variable: NEXT_PUBLIC_REGION
    value: asia-southeast1
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: G-9SSXWJTR1L
  - variable: TELEGRAM_BOT_TOKEN
    secret: TELEGRAM_BOT_TOKEN
    availability:
      - RUNTIME
  - variable: CRON_SECRET
    secret: CRON_SECRET
    availability:
      - RUNTIME
  - variable: NOWPAYMENTS_API_KEY
    secret: NOWPAYMENTS_API_KEY
    availability:
      - RUNTIME
  - variable: NOWPAYMENTS_IPN_SECRET
    secret: NOWPAYMENTS_IPN_SECRET
    availability:
      - RUNTIME
  - variable: TWITTER_CLIENT_ID
    secret: TWITTER_CLIENT_ID
    availability:
      - RUNTIME
  - variable: TWITTER_CLIENT_SECRET
    secret: TWITTER_CLIENT_SECRET
    availability:
      - RUNTIME
  - variable: GOOGLE_GENAI_API_KEY
    secret: GOOGLE_GENAI_API_KEY
    availability:
      - RUNTIME
  - variable: ENCRYPTION_KEY
    secret: ENCRYPTION_KEY
    availability:
      - RUNTIME
  - variable: DHAN_ACCESS_TOKEN
    secret: DHAN_ACCESS_TOKEN
    availability:
      - RUNTIME
  - variable: DHAN_CLIENT_ID
    secret: DHAN_CLIENT_ID
    availability:
      - RUNTIME
  - variable: DHAN_TOTP_SECRET
    secret: DHAN_TOTP_SECRET
    availability:
      - RUNTIME
  - variable: DHAN_PIN
    secret: DHAN_PIN
    availability:
      - RUNTIME
  - variable: SOLANA_RPC_URL
    secret: SOLANA_RPC_URL
    availability:
      - RUNTIME
  - variable: SOLANA_PRIVATE_KEY
    secret: SOLANA_PRIVATE_KEY
    availability:
      - RUNTIME
  - variable: LIQUIDITY_WS_SECRET
    secret: LIQUIDITY_WS_SECRET
    availability:
      - RUNTIME
  - variable: PUBLIC_LIVE_PASSPHRASE
    secret: PUBLIC_LIVE_PASSPHRASE
    availability:
      - RUNTIME
  # India ISP egress proxy for ALL NSE traffic (nseFetch honours NSE_HTTPS_PROXY).
  # Presents an Indian residential IP so NSE stops blocking us into the Dhan fallback.
  # NOTE: create the secret BEFORE deploying, else the rollout fails:
  #   firebase apphosting:secrets:set NSE_HTTPS_PROXY
  - variable: NSE_HTTPS_PROXY
    secret: NSE_HTTPS_PROXY
    availability:
      - RUNTIME
  # suggest-stock-zones: background batch after cron GET returns (cron-job.org 30s HTTP cap).
  # 3 symbols × ~25s Dhan fits reliably in 95s wall clock (10 was timing out at 2–3).
  - variable: STOCK_ZONES_BATCH_SIZE
    value: "3"
    availability:
      - RUNTIME
  - variable: STOCK_ZONES_MAX_RUN_MS
    value: "95000"
  - variable: STOCK_ZONES_SYMBOL_TIMEOUT_MS
    value: "28000"
    availability:
      - RUNTIME